<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1b1b" />
    <meta name="description" content="Tham quan Học viện Công nghệ Bưu chính Viễn thông trong không gian thực tế ảo 360°." />
    <title>PTIT Campus 360</title>
    <!-- FONT TRANG CHỦ: đổi họ font hoặc các weight được tải tại 3 dòng dưới. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/typography.css?v=1" />
    <style>
      :root {
        /* ================================================================
           CẤU HÌNH CHỮ TRANG CHỦ
           ================================================================ */
        --home-font: "Montserrat", Arial, sans-serif;
        --home-title-size: clamp(42px, 4.7vw, 66px);
        --home-title-weight: 610;
        --home-description-size: clamp(12px, 1.05vw, 15px);
        --home-description-weight: 400;
        --home-button-size: 12px;
        --home-button-weight: 700;
        /* DICH DONG BO LOGO VA TOAN BO CUM NOI DUNG: so am = sang trai. */
        --home-content-shift: -28px;
        --white: #fff;
        --black: #1c1b1b;
        --red: #e4002b;
        --red-soft: #f14666;
        font-family: var(--home-font);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { overflow: hidden; background: var(--black); color: var(--white); }
      button, a { font: inherit; }

      .hero {
        position: relative;
        min-height: 100svh;
        isolation: isolate;
        overflow: hidden;
        background: #111;
      }

      .hero__image {
        position: absolute;
        z-index: -3;
        inset: -2%;
        width: 104%;
        height: 104%;
        object-fit: cover;
        object-position: center 58%;
        animation: hero-breathe 14s ease-in-out infinite alternate;
      }

      .hero::before {
        position: absolute;
        z-index: -2;
        inset: 0;
        /*
         * HAI VUNG DEN RIENG CUA TRANG CHU:
         * - 52% = do lan rong cua vung den PHIA TREN.
         * - 58% = do lan rong cua vung den PHIA DUOI.
         * Tang hai so nay de vung den lan rong hon; giam de vung den gon lai.
         * .48 va .94 la do toi tai mep tren/duoi (0 = trong, 1 = den).
         */
        background:
          linear-gradient(to bottom, rgba(5,6,8,.48) 0%, rgba(5,6,8,.16) 28%, transparent 52%),
          linear-gradient(to top, rgba(5,6,8,.94) 0%, rgba(5,6,8,.42) 32%, transparent 58%);
        content: "";
        pointer-events: none;
      }

      .hero::after {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: none;
        content: "";
        pointer-events: none;
      }

      .hero__inner {
        width: min(1440px, 100%);
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        padding: clamp(24px, 4vw, 58px) clamp(24px, 6vw, 92px) clamp(40px, 7vh, 80px);
      }

      .brand-lockup {
        width: fit-content;
        max-width: 100%;
        display: flex;
        align-items: center;
        gap: 16px;
        /* Khoang trong ben trai cua cum logo PTIT. */
        padding: 7px 18px 7px 20px;
        border: 1px solid rgba(255,255,255,.65);
        border-radius: 999px;
        background: rgba(255,255,255,.94);
        color: var(--black);
        box-shadow: 0 16px 45px rgba(0,0,0,.18);
        backdrop-filter: blur(12px);
        margin-left: var(--home-content-shift);
      }

      .brand-lockup__ptit { width: 36px; height: 38px; object-fit: contain; }
      .brand-lockup__copy { min-width: 0; }
      .brand-lockup__copy strong, .brand-lockup__copy span { display: block; white-space: nowrap; }
      .brand-lockup__copy strong { color: var(--red); font-size: 13px; font-weight: 800; letter-spacing: .01em; text-transform: uppercase; }
      .brand-lockup__copy span { margin-top: 3px; color: #4f5359; font-size: 9.5px; font-weight: 500; }
      .brand-lockup__divider { width: 1px; height: 34px; background: #d9d9d9; }
      .brand-lockup__cts { width: 120px; height: 38px; object-fit: contain; filter: contrast(1.12) saturate(1.12); }

      .hero__content {
        width: min(760px, 100%);
        margin-top: auto;
        margin-left: var(--home-content-shift);
        padding-top: 80px;
        animation: content-in .8s cubic-bezier(.2,.75,.25,1) both;
      }

      .hero__eyebrow {
        margin: 0 0 18px;
        color: rgba(255,255,255,.72);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .hero h1 {
        max-width: 760px;
        margin: 0;
        font-family: "Montserrat", Arial, sans-serif;
        font-size: var(--home-title-size);
        font-weight: var(--home-title-weight);
        font-style: normal;
        letter-spacing: -.03em;
        line-height: 1.04;
        text-wrap: balance;
      }

      .hero h1 span { color: var(--red); white-space: nowrap; }
      .hero__description {
        max-width: 660px;
        margin: 24px 0 0;
        color: rgba(255,255,255,.72);
        font-size: var(--home-description-size);
        font-weight: var(--home-description-weight);
        line-height: 1.75;
      }

      .hero__cta {
        min-height: 56px;
        width: fit-content;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        padding: 0 24px 0 13px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--red-soft), var(--red));
        color: #fff;
        box-shadow: 0 15px 35px rgba(228,0,43,.34);
        font-size: var(--home-button-size);
        font-weight: var(--home-button-weight);
        letter-spacing: .055em;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      }

      .hero__cta:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 19px 42px rgba(228,0,43,.44); }
      .hero__cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      .hero__play { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.52); border-radius: 50%; background: rgba(255,255,255,.16); }
      .hero__play svg { width: 12px; height: 12px; fill: currentColor; transform: translateX(1px); }

      /* Hieu ung noi lien trang bia voi Campus khi bam nut bat dau. */
      .page-transition {
        position: fixed;
        z-index: 9999;
        inset: 0;
        background: #080808;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity .48s ease, visibility .48s ease;
      }
      body.is-entering-tour .page-transition { opacity: 1; visibility: visible; }
      body.is-entering-tour .hero__content { transform: translateY(10px) scale(.985); opacity: 0; transition: opacity .3s ease, transform .4s ease; }
      body.is-entering-tour .hero__image { transform: scale(1.08); transition: transform .65s ease; }

      @keyframes content-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      @keyframes hero-breathe { from { transform: scale(1.01); } to { transform: scale(1.055); } }

      @media (max-width: 720px) {
        :root { --home-content-shift: 0px; }
        .hero__image { object-position: 58% center; }
        .hero::before { background: linear-gradient(180deg, rgba(6,7,9,.3) 0%, rgba(6,7,9,.12) 25%, rgba(6,7,9,.93) 100%); }
        .hero__inner { padding: 20px 20px 34px; }
        .brand-lockup { gap: 9px; padding: 8px 11px 8px 8px; }
        .brand-lockup__copy strong { font-size: 8px; }
        .brand-lockup__copy span { max-width: 145px; overflow: hidden; font-size: 5px; text-overflow: ellipsis; }
        .brand-lockup__cts { width: 72px; }
        .hero__content { padding-top: 110px; }
        .hero__eyebrow { font-size: 9px; }
        .hero h1 { font-size: clamp(38px, 12vw, 58px); }
        .hero__description { font-size: 13px; line-height: 1.65; }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero__image, .hero__content { animation: none; }
        .hero__cta { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page-transition" aria-hidden="true"></div>
    <main class="hero">
      <img class="hero__image" src="assets/ptit_banner.png" alt="Tòa nhà PTIT với các phòng lab Samsung, Viettel và Thư viện" />
      <div class="hero__inner">
        <div class="brand-lockup" aria-label="PTIT Campus 360 và CTS Lab">
          <img class="brand-lockup__ptit" src="campus/logo-PTIT-826x1024-removebg-preview.png" alt="" />
          <div class="brand-lockup__copy">
            <strong>PTIT Campus 360</strong>
            <span>Học viện Công nghệ Bưu chính Viễn thông</span> 
          </div>
          <span class="brand-lockup__divider" aria-hidden="true"></span>
          <img class="brand-lockup__cts" src="campus/IMG_20260403_162544-removebg-preview.png" alt="CTS Lab" />
        </div>

        <section class="hero__content" aria-labelledby="hero-title">
          <!--<p class="hero__eyebrow">Học viện Công nghệ Bưu chính Viễn thông</p> -->
          <h1 id="hero-title">Tham quan Học viện<br />trong không gian <span>360°</span></h1>
          <p class="hero__description">Khám phá cơ sở vật chất, môi trường học tập và không gian Học viện Công nghệ Bưu chính Viễn thông thông qua công nghệ thực tế ảo VR360.</p>
          <a class="hero__cta" href="campus/tour.html?startscene=scene_1">
            <span class="hero__play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2.7v10.6L13 8 4 2.7z" /></svg></span>
            Bắt đầu khám phá
          </a>
        </section>
      </div>
    </main>
    <script>
      (function () {
        const cta = document.querySelector('.hero__cta');
        const requestedUI = new URLSearchParams(window.location.search).get('ui');
        // GIAO DIEN CHINH: dark. Chi dung ban trang khi URL ghi ro ?ui=current.
        const campusUI = requestedUI === 'current' ? 'current' : 'dark';
        const target = new URL(cta.href);
        target.searchParams.set('ui', campusUI);
        cta.href = target.href;

        cta.addEventListener('click', function (event) {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          document.body.classList.add('is-entering-tour');
          window.setTimeout(function () { window.location.href = cta.href; }, 430);
        });
      })();
    </script>
  </body>
</html>
