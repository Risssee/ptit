<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang mở CTS Lab</title>
  <script>
    // CTS giữ panorama độc lập trong /labs/cts, nhưng dùng chung giao diện campus hiện hành.
    const params = new URLSearchParams(window.location.search);
    const requestedScene = params.get("startscene") || "scene_cts_c1";
    const scene = /^scene_cts(?:2)?_[a-zA-Z0-9_]+$/.test(requestedScene)
      ? requestedScene
      : "scene_cts_c1";
    window.location.replace(`../../campus/tour.html?startscene=${encodeURIComponent(scene)}&ui=dark`);
  </script>
</head>
<body>
  <p>Đang mở CTS Lab…</p>
</body>
</html>
