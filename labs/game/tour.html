<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../assets/typography.css?v=1" />
    <script src="../../assets/reload-home.js?v=1" data-home="../../index.html"></script>
    <title>Đang mở Game Lab trong Campus Tour</title>
    <script>
      // Giữ URL Game Lab cũ hoạt động, nhưng chuyển sang runtime Campus hợp nhất.
      // startscene vẫn được giữ để các bookmark cũ có thể mở đúng scene Game.
      const params = new URLSearchParams(window.location.search);
      const requestedScene = params.get("startscene") || "scene_game_0l";
      const scene = /^scene_game_[a-zA-Z0-9_]+$/.test(requestedScene)
        ? requestedScene
        : "scene_game_0l";
      window.location.replace(`../../campus/tour.html?startscene=${encodeURIComponent(scene)}`);
    </script>
  </head>
  <body>
    <p>Đang chuyển đến Game Lab trong Campus Tour…</p>
    <p><a href="../../campus/tour.html?startscene=scene_game_0l">Mở Game Lab</a></p>
  </body>
</html>
